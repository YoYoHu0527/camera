<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>摄像头授权与拍照测试</title>
    <style>
      :root {
        color: #172033;
        background: #f8fafc;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        width: min(100%, 720px);
        min-height: 100svh;
        margin: 0 auto;
        padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.75rem, 8vw, 2.25rem);
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      video, canvas {
        width: 100%;
        max-width: 560px;
        border-radius: 12px;
        background: #111827;
        display: block;
        margin: 16px auto 0;
      }

      button {
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 10px;
        padding: 12px 16px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        background: #155eef;
        color: white;
      }

      #status {
        min-height: 1.5em;
        margin: 14px 0 0;
        color: #475467;
        overflow-wrap: anywhere;
      }

      .notice {
        margin: 0 0 20px;
        padding: 14px;
        border-radius: 10px;
        background: #eff8ff;
        line-height: 1.55;
        overflow-wrap: anywhere;
      }

      @media (min-width: 600px) {
        body { padding-top: 40px; padding-bottom: 40px; }
        button { width: auto; }
      }
    </style>
  </head>
  <body>
    <h1>摄像头授权与拍照测试</h1>
    <p class="notice">点击按钮后，页面会请求使用前置摄像头。只有在您允许浏览器授权后，才会拍摄一张照片；照片仅显示在当前页面，不会上传。</p>
    <button id="start" type="button">同意并开启前置摄像头</button>
    <p id="status" role="status"></p>
    <video id="preview" playsinline muted hidden></video>
    <canvas id="photo" hidden></canvas>

    <script>
      const start = document.querySelector('#start');
      const preview = document.querySelector('#preview');
      const photo = document.querySelector('#photo');
      const status = document.querySelector('#status');

      start.addEventListener('click', async () => {
        let stream;
        try {
          if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
            throw new Error('安全上下文不可用：请通过 HTTPS 网站在 Safari 或 Chrome 中打开，不要直接打开聊天附件或本地 HTML 文件。');
          }
          status.textContent = '正在请求浏览器摄像头授权…';
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' },
            audio: false,
          });

          preview.srcObject = stream;
          preview.hidden = false;
          await preview.play();
          await new Promise(resolve => setTimeout(resolve, 500));

          photo.width = preview.videoWidth;
          photo.height = preview.videoHeight;
          photo.getContext('2d').drawImage(preview, 0, 0, photo.width, photo.height);
          photo.hidden = false;
          status.textContent = '已拍摄。照片只保留在此页面。';
        } catch (error) {
          const reason = {
            NotAllowedError: '摄像头权限被拒绝，或当前浏览器/内置浏览器不允许访问摄像头。',
            NotFoundError: '未检测到可用摄像头。',
            NotReadableError: '摄像头正被其他应用占用，或系统无法读取该设备。',
          }[error.name];
          status.textContent = `无法拍照：${reason || error.message || error.name || '未知错误'}`;
        } finally {
          if (stream) stream.getTracks().forEach(track => track.stop());
          preview.srcObject = null;
          preview.hidden = true;
        }
      });
    </script>
  </body>
</html>
